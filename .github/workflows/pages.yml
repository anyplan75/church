name: Publish GitHub Pages
on:
  push:
    branches: [gh-pages]
permissions:
  pages: write
  id-token: write
  contents: read
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage site
        run: |
          mkdir site
          rsync -a --exclude .git --exclude .github --exclude site ./ site/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
